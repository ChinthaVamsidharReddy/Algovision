# Local development profile: `mvn spring-boot:run -Dspring-boot.run.profiles=dev` (or SPRING_PROFILES_ACTIVE=dev).
# Values here are public and for a developer machine only. Never enable this profile in production.
auth:
  token-secret: ${AUTH_TOKEN_SECRET:dev-only-secret-change-me-0123456789abcdef0123456789}
  refresh-cookie:
    secure: false
logging:
  level:
    dev.algovision: DEBUG
