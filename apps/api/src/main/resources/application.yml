

spring:
  application:
    name: algovision-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/algovision}
    username: ${SPRING_DATASOURCE_USERNAME:algovision}
    password: ${SPRING_DATASOURCE_PASSWORD:algovision}

    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:0}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTIONTIMEOUT:30000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLETIMEOUT:600000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true

app:
  allowed-origins: ${APP_ALLOWED_ORIGINS:${ALLOWED_ORIGINS:http://localhost:3000}}

  origin-check:
    enabled: ${APP_ORIGIN_CHECK_ENABLED:true}
    client-header: ${APP_ORIGIN_CHECK_CLIENT_HEADER:X-AlgoVision-Client}
    client-header-value: ${APP_ORIGIN_CHECK_CLIENT_HEADER_VALUE:web}

  roles:
    instructor-enabled: ${APP_ROLES_INSTRUCTOR_ENABLED:false}

auth:
  token-secret: ${AUTH_TOKEN_SECRET}

  access-ttl: ${AUTH_ACCESS_TTL:15m}
  refresh-ttl: ${AUTH_REFRESH_TTL:14d}
  refresh-grace: ${AUTH_REFRESH_GRACE:10s}
  password-iterations: ${AUTH_PASSWORD_ITERATIONS:600000}

  login-max-failures: ${AUTH_LOGIN_MAX_FAILURES:5}
  login-window: ${AUTH_LOGIN_WINDOW:15m}

  refresh-cookie:
    name: ${AUTH_REFRESH_COOKIE_NAME:av_refresh}
    secure: ${AUTH_REFRESH_COOKIE_SECURE:true}
    same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
    path: ${AUTH_REFRESH_COOKIE_PATH:/api/v1/auth}

  reset:
    ttl: ${AUTH_RESET_TTL:30m}
    url: ${APP_PUBLIC_URL:http://localhost:3000}/reset-password
    max-requests: ${AUTH_RESET_MAX_REQUESTS:3}
    window: ${AUTH_RESET_WINDOW:1h}

  mailer: ${AUTH_MAILER:console}