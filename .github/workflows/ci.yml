name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:content
      - run: pnpm check:content
      - run: pnpm typecheck
      - run: pnpm lint
      # REQUIRE_TOOLCHAINS=1 turns a missing javac/python3/g++/gcc into a failure instead of a skip.
      - run: pnpm test:strict
      - run: pnpm --filter @algovision/web build

  browser-smoke:
    runs-on: ubuntu-latest
    needs: web-and-content
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @algovision/web build
      - run: npx --yes playwright@1 install --with-deps chromium
      - run: |
          (cd apps/web && node .next/standalone/apps/web/server.js &) 
          sleep 5
          cd apps/web && NODE_PATH=$(npm root -g) node e2e/smoke.mjs http://localhost:3000 e2e-output
        env:
          PORT: "3000"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: apps/web/e2e-output

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # `verify` runs unit tests, then integration tests (Testcontainers; Docker is available here).
      - run: mvn -B -f apps/api/pom.xml verify

  db-constraints:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          export PGPASSWORD=postgres PGHOST=localhost PGUSER=postgres
          psql -v ON_ERROR_STOP=1 -q -c "CREATE DATABASE algovision"
          for f in $(ls apps/api/src/main/resources/db/migration/V*.sql | sort -V); do psql -v ON_ERROR_STOP=1 -q -d algovision -f "$f"; done
          psql -v ON_ERROR_STOP=1 -d algovision -f infra/db/verify.sql -t -A | tail -1
